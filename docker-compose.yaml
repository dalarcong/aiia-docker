name: aiia

# Shared by api and train
x-api-image: &api-image
  build:
    context: ./api
    args:
      TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
  image: aiia-api:${TORCH_VARIANT:-cpu}

services:
  api:
    <<: *api-image
    expose:
      - "8000"
    environment:
      OMP_NUM_THREADS: ${API_CPUS:-4}
    volumes:
      - models:/models
    shm_size: 256m
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-4}"
          memory: ${API_MEMORY:-2g}
    memswap_limit: ${API_MEMORY:-2g}
    init: true
    restart: unless-stopped
    networks:
      - backend

  ui:
    build: ./ui
    image: aiia-ui:latest
    ports:
      - "${UI_PORT:-7860}:7860"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    init: true
    restart: unless-stopped
    networks:
      - backend
      - frontend

  train:
    <<: *api-image
    profiles: [train]
    command: ["python", "train.py"]
    environment:
      OMP_NUM_THREADS: ${TRAIN_CPUS:-8}
    volumes:
      - models:/models
      - data:/data
    shm_size: 2g
    deploy:
      resources:
        limits:
          cpus: "${TRAIN_CPUS:-8}"
          memory: ${TRAIN_MEMORY:-6g}
    memswap_limit: ${TRAIN_MEMORY:-6g}
    init: true
    healthcheck:
      disable: true
    networks:
      - frontend

networks:
  backend:
    internal: true
  frontend:

volumes:
  models:
  data:
